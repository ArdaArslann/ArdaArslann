<title id="t-light">Arda Arslan, Backend and Android Developer</title>
<desc id="d-light">An API response describing Arda Arslan (Java, Spring Boot, Kotlin, Jetpack Compose; experience at Turkcell-Paycell, TÜBİTAK 2247-C and EasyFlex; based in Türkiye; available now for remote, part-time and contract work; full-time from July 2027), rendered on an Android phone with the Open to work switch turned on.</desc>
<style>
    .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif}
    .k{fill:#9a5a00} .s{fill:#0b7a6c} .p{fill:#5a6676} .t{fill:#1c2430}
    .in{animation:in .32s ease-out both}
    .up{animation:up .4s cubic-bezier(.2,.7,.2,1) both}
    .pk{opacity:0;animation:pk .55s ease-in-out 1.44s both}
    .knob{animation:knob .35s cubic-bezier(.3,.7,.2,1) 2.59s both}
    .track{animation:track .35s ease 2.59s both}
    @keyframes in{from{opacity:0}}
    @keyframes up{from{opacity:0;transform:translateY(5px)}}
    @keyframes pk{0%{opacity:0;transform:translateX(0)}20%,80%{opacity:1}100%{opacity:0;transform:translateX(56px)}}
    @keyframes knob{from{transform:translateX(-15px);fill:#ffffff}}
    @keyframes track{from{fill:#c9d1db}}
    @media (prefers-reduced-motion:reduce){.in,.up,.knob,.track{animation:none}.pk{display:none}}
    </style>
